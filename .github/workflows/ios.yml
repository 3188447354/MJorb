name: iOS

on:
  pull_request:
  # 特性/发布分支推送即自动编译（PR 驱动之外的第二条通路）。
  # 排除 main：main 由 ios-fast.yml 负责出包。
  # publish-release 仍只在 workflow_dispatch 触发，push 路径绝不会自动发布 Release。
  #
  # 时间预算（2026-09-14 调整）：原先 push 一律跑完整门 = 全量构建两遍（Debug 给测试、
  # Release 给 IPA）+ 一遍模拟器 UI 回归 ≈ 20 分钟，日常改 UI/文案等得太久。
  # 现在由 classify-change 判定：非高风险改动只跑「编译 + 打包 + rork-sign」（约 10 分钟），
  # 只有命中签名/安装/配对/RustBridge/工程配置等高风险路径才补跑 UI 回归。
  # PR 与手动 dispatch 一律跑完整门（发布路径必须有 UI 回归背书）。
  push:
    branches-ignore: [main]
    paths:
      - "Seal/**"
      - "SealTests/**"
      - "SealUITests/**"
      - "SealTunnel/**"
      - "Vendor/Minimuxer/**"
      - "project.yml"
      - "Config/**"
      - "Scripts/**"
      - ".github/workflows/ios.yml"
  workflow_dispatch:
    inputs:
      publish_release:
        description: "两个门全绿后发布 GitHub Release（IPA 永久保留，不受 artifact 30 天限制）"
        type: boolean
        default: false
      release_tag:
        description: "Release 标签（留空则自动 v<版本>，须与 MARKETING_VERSION 对齐）"
        type: string
        default: ""
      prerelease:
        description: "标记为预发布版本"
        type: boolean
        default: false

concurrency:
  group: ios-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # 时间预算闸门：判断本次改动是否需要「完整门」（UI 回归）。
  # push 到非 main 分支时，只有命中高风险路径才跑；PR 与手动 dispatch 一律跑。
  # 目的：日常改 UI/文案不必每次等 20 分钟，而真会伤到用户的改动（签名/安装/配对）仍自动跑全量。
  # 判定取不到 diff 时一律按「需要完整门」处理（fail-closed，宁可慢不可漏）。
  classify-change:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      full: ${{ steps.classify.outputs.full }}
    steps:
      - uses: actions/checkout@v6.0.2
        with:
          fetch-depth: 0

      - name: Decide whether the full gate is required
        id: classify
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.before }}
          HEAD_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          # PR 与手动 dispatch 一律视为需要完整门（发布路径必须有 UI 回归背书）。
          if [ "$EVENT_NAME" != "push" ]; then
            echo "full=true" >> "$GITHUB_OUTPUT"
            echo "event=$EVENT_NAME -> full gate"
            exit 0
          fi
          # 新分支 / force-push 时 before 可能不是有效提交，取不到 diff 就按完整门处理。
          if ! git cat-file -e "${BASE_SHA}^{commit}" 2>/dev/null; then
            echo "full=true" >> "$GITHUB_OUTPUT"
            echo "no usable base commit -> full gate"
            exit 0
          fi
          CHANGED="$(git diff --name-only "$BASE_SHA" "$HEAD_SHA")"
          printf 'changed files:\n%s\n' "$CHANGED"
          if [ -z "$CHANGED" ]; then
            echo "full=true" >> "$GITHUB_OUTPUT"
            echo "empty diff -> full gate"
            exit 0
          fi
          if printf '%s\n' "$CHANGED" | grep -Eq '^(Vendor/Minimuxer/RustBridge/|SealTunnel/|Seal/Core/Signing/|Seal/Core/Apps/|Seal/Core/Import/|Seal/Infrastructure/Signing/|Seal/Infrastructure/Installation/|Seal/Application/|Seal/Features/Settings/|SealTests/|SealUITests/|project.yml|Config/|Scripts/|\.github/workflows/)'; then
            echo "full=true" >> "$GITHUB_OUTPUT"
            echo "high-risk paths touched -> full gate"
          else
            echo "full=false" >> "$GITHUB_OUTPUT"
            echo "non-risky change -> compile-only"
          fi

  build-package:
    runs-on: macos-26
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v6.0.2

      - name: Check release safety invariants
        run: python3 Scripts/verify-release-safety.py

      - name: Cache Rust toolchain and cargo artifacts
        uses: actions/cache@v5
        with:
          path: |
            ~/.rustup/toolchains
            ~/.cargo/registry
            ~/.cargo/git
            Vendor/Minimuxer/RustBridge/target
          key: rustbridge-${{ runner.os }}-${{ hashFiles('Vendor/Minimuxer/RustBridge/Cargo.lock') }}
          restore-keys: |
            rustbridge-${{ runner.os }}-

      - name: Select pinned Xcode 26.5
        run: |
          test -d /Applications/Xcode_26.5.app
          sudo xcode-select --switch /Applications/Xcode_26.5.app/Contents/Developer
          xcodebuild -version
          test "$(xcodebuild -version | head -n 1)" = "Xcode 26.5"

      - name: Install pinned Rust inspection tools
        run: |
          rustup toolchain install 1.97.1 --profile minimal --component llvm-tools-preview
          rustup default 1.97.1
          rustc --version --verbose

      - name: Audit vendored RustBridge FFI source
        run: bash Scripts/audit-rustbridge-source.sh

      - name: Ensure RustBridge matches Rust source
        env:
          RUST_TOOLCHAIN: 1.97.1
        run: bash Scripts/ensure-rustbridge.sh

      - name: Verify vendored RustBridge supports iOS 16
        run: MAX_IOS_VERSION=16.0 bash Scripts/verify-rustbridge-minos.sh

      - name: Verify vendored RustBridge typed FFI symbols
        run: bash Scripts/verify-rustbridge-symbols.sh

      - name: Install pinned XcodeGen
        run: |
          curl --fail --location --silent --show-error \
            --output "$RUNNER_TEMP/xcodegen.zip" \
            https://github.com/yonaskolb/XcodeGen/releases/download/2.45.4/xcodegen.zip
          echo "090ec29491aad50aec10631bf6e62253fed733c50f3aab0f5ffc86bc170bdbef  $RUNNER_TEMP/xcodegen.zip" | shasum -a 256 --check
          ditto -x -k "$RUNNER_TEMP/xcodegen.zip" "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/xcodegen/bin" >> "$GITHUB_PATH"
          "$RUNNER_TEMP/xcodegen/bin/xcodegen" --version

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Verify Seal minimum deployment target remains iOS 17
        run: |
          TARGET="$(xcodebuild \
            -project Seal.xcodeproj \
            -target Seal \
            -configuration Debug \
            -sdk iphonesimulator \
            -showBuildSettings | awk -F ' = ' '/^[[:space:]]*IPHONEOS_DEPLOYMENT_TARGET = / { print $2; exit }')"
          echo "Seal IPHONEOS_DEPLOYMENT_TARGET=$TARGET"
          test "$TARGET" = "17.0"
          # UIDeviceFamily 改由 TARGETED_DEVICE_FAMILY 构建设置注入（消除 Info.plist 覆盖警告），断言仍为 iPhone+iPad
          FAMILY="$(xcodebuild \
            -project Seal.xcodeproj \
            -target Seal \
            -configuration Debug \
            -sdk iphonesimulator \
            -showBuildSettings | awk -F ' = ' '/^[[:space:]]*TARGETED_DEVICE_FAMILY = / { print $2; exit }')"
          echo "Seal TARGETED_DEVICE_FAMILY=$FAMILY"
          test "$FAMILY" = "1,2"

      - name: Verify SealTunnel target and Packet Tunnel configuration
        run: |
          TARGET="$(xcodebuild \
            -project Seal.xcodeproj \
            -target SealTunnel \
            -configuration Debug \
            -sdk iphonesimulator \
            -showBuildSettings | awk -F ' = ' '/^[[:space:]]*IPHONEOS_DEPLOYMENT_TARGET = / { print $2; exit }')"
          echo "SealTunnel IPHONEOS_DEPLOYMENT_TARGET=$TARGET"
          test "$TARGET" = "17.0"
          POINT="$(/usr/libexec/PlistBuddy -c 'Print :NSExtension:NSExtensionPointIdentifier' SealTunnel/Info.plist)"
          test "$POINT" = "com.apple.networkextension.packet-tunnel"
          grep -q "packet-tunnel-provider" SealTunnel/SealTunnel.entitlements
          grep -q "packet-tunnel-provider" Seal/Resources/Seal.entitlements

      # 单元 + UI 回归已拆到独立的 swift-regression job（见下），此处只负责出包。
      - name: Build unsigned IPA
        run: SEAL_IPA_CONFIGURATION=Release SEAL_SKIP_XCODEGEN=1 bash Scripts/build-unsigned-ipa.sh

      - name: Verify unsigned IPA
        run: bash Scripts/verify-ipa.sh build/Seal.ipa

      - name: Upload unsigned IPA
        uses: actions/upload-artifact@v7.0.1
        with:
          name: Seal-${{ github.run_number }}
          if-no-files-found: error
          path: |
            build/Seal.ipa
            build/Seal.ipa.sha256
            build/Seal-Info.plist
            build/SealTunnel-Info.plist
          retention-days: 30

      - name: Upload build metadata
        if: always()
        uses: actions/upload-artifact@v7.0.1
        with:
          name: Seal-Build-Metadata-${{ github.run_number }}
          if-no-files-found: warn
          path: |
            build/Seal.ipa.sha256
            build/Seal-Info.plist
            build/SealTunnel-Info.plist
          retention-days: 14

  # 单元 + UI 回归门。从 build-package 里拆出来独立成 job，有两个好处：
  # 1) 与 build-package 并行：PR/发布不再「先等 Debug 全量构建+测试、再等 Release 全量构建」串行叠加；
  # 2) 非高风险 push 直接跳过（见 classify-change），日常改动省掉约 10 分钟。
  # 注意：本 job 是发布的前置（publish-release 的 needs 含它），不得从 needs 里摘掉。
  swift-regression:
    needs: [classify-change]
    if: needs.classify-change.outputs.full == 'true'
    runs-on: macos-26
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v6.0.2

      - name: Cache Swift Package Manager dependencies
        uses: actions/cache@v5
        with:
          path: |
            ~/Library/Caches/org.swift.swiftpm
            ~/Library/Developer/Xcode/DerivedData/Seal-*/SourcePackages
          key: spm-${{ runner.os }}-${{ hashFiles('project.yml') }}
          restore-keys: |
            spm-${{ runner.os }}-

      - name: Select pinned Xcode 26.5
        run: |
          test -d /Applications/Xcode_26.5.app
          sudo xcode-select --switch /Applications/Xcode_26.5.app/Contents/Developer
          xcodebuild -version
          test "$(xcodebuild -version | head -n 1)" = "Xcode 26.5"

      - name: Install pinned XcodeGen
        run: |
          curl --fail --location --silent --show-error \
            --output "$RUNNER_TEMP/xcodegen.zip" \
            https://github.com/yonaskolb/XcodeGen/releases/download/2.45.4/xcodegen.zip
          echo "090ec29491aad50aec10631bf6e62253fed733c50f3aab0f5ffc86bc170bdbef  $RUNNER_TEMP/xcodegen.zip" | shasum -a 256 --check
          ditto -x -k "$RUNNER_TEMP/xcodegen.zip" "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/xcodegen/bin" >> "$GITHUB_PATH"
          "$RUNNER_TEMP/xcodegen/bin/xcodegen" --version

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Run Swift unit and UI regression tests
        run: |
          SIMULATOR_UDID="$(xcrun simctl list devices available -j | python3 -c 'import json,sys; d=json.load(sys.stdin)["devices"]; print(next(device["udid"] for runtime, devices in d.items() if "iOS-26-5" in runtime for device in devices if device.get("isAvailable") and device.get("name", "").startswith("iPhone")))')"
          xcrun simctl boot "$SIMULATOR_UDID" || true
          xcrun simctl bootstatus "$SIMULATOR_UDID" -b
          rm -rf build/TestResults.xcresult
          xcodebuild test \
            -project Seal.xcodeproj \
            -scheme Seal \
            -destination "platform=iOS Simulator,id=$SIMULATOR_UDID" \
            -parallel-testing-enabled NO \
            -resultBundlePath build/TestResults.xcresult \
            CODE_SIGNING_ALLOWED=NO \
            OTHER_SWIFT_FLAGS='$(inherited) -continue-building-after-errors'

      - name: Upload regression test result bundle
        if: always()
        uses: actions/upload-artifact@v7.0.1
        with:
          name: Seal-TestResults-${{ github.run_number }}
          if-no-files-found: warn
          path: build/TestResults.xcresult
          retention-days: 14

  # rork-sign 纯 Swift 签名核心自带测试（Mach-O 签名、CodeResources、描述文件、
  # 证书请求、OCSP、Bundle 递归签名等）。在 macOS host 上用 SPM 直接 swift test，
  # 作为签名核心的独立回归门，与主 App 完整门并行，避免签名器演进悄悄破坏既有行为。
  rork-sign-tests:
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6.0.2

      - name: Select pinned Xcode 26.5
        run: |
          test -d /Applications/Xcode_26.5.app
          sudo xcode-select --switch /Applications/Xcode_26.5.app/Contents/Developer
          swift --version

      - name: Cache rork-sign SwiftPM artifacts
        uses: actions/cache@v5
        with:
          path: Vendor/rork-sign/.build
          key: rorksign-spm-${{ runner.os }}-${{ hashFiles('Vendor/rork-sign/Package.resolved') }}
          restore-keys: |
            rorksign-spm-${{ runner.os }}-

      - name: Resolve rork-sign dependencies
        working-directory: Vendor/rork-sign
        run: swift package resolve

      - name: Run rork-sign unit tests
        working-directory: Vendor/rork-sign
        run: swift test

  # 全绿后可选发布 GitHub Release：手动 dispatch 时勾选 publish_release。
  # Release 资产永久保留，弥补 upload-artifact 30 天自动过期；只下载+上传，用 ubuntu 即可。
  publish-release:
    # swift-regression 必须在 needs 里：测试已从 build-package 拆出，
    # 否则发布可能在 UI 回归还没跑完时就发出去。dispatch 路径 full 恒为 true，不会被跳过。
    needs: [classify-change, build-package, rork-sign-tests, swift-regression]
    if: github.event_name == 'workflow_dispatch' && inputs.publish_release == true
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6.0.2

      - name: Download unsigned IPA artifact
        uses: actions/download-artifact@v7
        with:
          name: Seal-${{ github.run_number }}
          path: release

      - name: Publish GitHub Release via gh
        env:
          GH_TOKEN: ${{ secrets.RELEASE_TOKEN }}
          INPUT_TAG: ${{ inputs.release_tag }}
          PRERELEASE: ${{ inputs.prerelease }}
          RUN_NUMBER: ${{ github.run_number }}
          SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          ls -la release
          VER="$(python3 -c "import plistlib;print(plistlib.load(open('release/Seal-Info.plist','rb'))['CFBundleShortVersionString'])")"
          TAG="$INPUT_TAG"
          if [ -z "$TAG" ]; then TAG="v${VER}"; fi
          if [ "${TAG#v}" != "$VER" ]; then
            echo "Release tag must match the IPA marketing version" >&2
            exit 1
          fi
          NOTES="$(cat RELEASE_NOTES.md)"
          ARGS=(--title "Seal $TAG" --notes "$NOTES")
          if [ "$PRERELEASE" = "true" ]; then ARGS+=(--prerelease); fi
          gh release create "$TAG" "${ARGS[@]}" --repo sunuannian1/Seal-Releases \
            release/Seal.ipa \
            release/Seal.ipa.sha256 \
            release/Seal-Info.plist \
            release/SealTunnel-Info.plist
          echo "published $TAG"
