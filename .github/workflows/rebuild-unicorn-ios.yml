name: Rebuild Unicorn (armv8.0 / no LSE)

# ── 这个工作流是干什么的 ──────────────────────────────────────────────────────
# 上游 `mahee96/unicorn` 的预编译包（`2.1.4-multiarch`）**带 ARMv8.1 的 LSE 原子指令**，
# 在 A10/A10X（iPad 第 6/7 代、iPad Pro 2017）上是 SIGILL 秒退 —— 详见
# `Scripts/verify-no-lse.py` 的模块 docstring 与 `Scripts/ensure-unicorn.sh`。
#
# 本工作流从 pinned 源码重编一份**不带 LSE** 的 Unicorn.xcframework，
# 当场量 `verify-no-lse.py`（LSE=0 + minOS ≤ 17.4），把产物与缓存一并产出。
#
# ⚠️ **为什么不只靠 `workflow_dispatch`**：GitHub 只把**默认分支（main）**上的工作流
#    注册进 workflow 列表 ⇒ 本文件只存在于 `perf/signing-renewal-speed` 时
#    `gh workflow run "Rebuild Unicorn…"` 会报 `could not find any workflows named …` ✗。
#    ⇒ 与同仓的 `rebuild-rustbridge-ios16.yml` 一样，补一条 **push + paths** 自触发：
#      改这三个文件里的任意一个就会重编（改构建配方本就该重编），
#      稳态下 `ensure-unicorn.sh` 会因指纹命中在 1 分钟内早退，代价可忽略。
on:
  workflow_dispatch:
    inputs:
      target_cpu:
        description: "目标 CPU 型号（默认 apple-a10：A10 无 LSE，= iOS 17.4 能跑的最老芯片）"
        required: false
        default: "apple-a10"
  push:
    branches:
      - perf/signing-renewal-speed
    paths:
      - .github/workflows/rebuild-unicorn-ios.yml
      - Scripts/ensure-unicorn.sh
      - Scripts/verify-no-lse.py

permissions:
  contents: read

jobs:
  rebuild:
    # ⚠️ 必须跑在 **arm64** 的 macOS 上；**不能**用 `macos-26-intel`（实测直接失败）。
    #   原因在 Unicorn 自己的 `CMakeLists.txt:384-392`：它把 `qemu/configure` 当**本机**编译跑，
    #   而传给 configure 的 `--extra-cflags` 里**只有 `-isysroot`、没有 `-arch`**
    #   （`${CMAKE_C_FLAGS}` 仅在 `UNICORN_FUZZ=ON` 时才拼进去，该选项默认 OFF）
    #   ⇒ configure 那句「能不能生成可执行文件」的探测会按**宿主机架构**编译
    #     （platform 能从 `-isysroot` 的 SDKSettings 推出来，**arch 推不出来**）
    #   ⇒ x86_64 宿主会得到 `x86_64-apple-ios`，而 iPhoneOS SDK 根本没有 x86_64 切片
    #   ⇒ `CMake Error … qemu/configure failed (1): cannot build an executable (is your linker broken?)`
    #   2026-10-08 实测 run 37757816680 就是死在这里 —— Intel 宿主对**本作业**并不等价。
    #
    #   而 `macos-26`（arm64）池当时已枯竭（排队 15 分 02 秒被回收、`steps=[]`、拿不到 runner；
    #   见 `docs/knowledge/PITFALLS.md` 坑位 10），探针实测 `macos-15`（arm64）**8 秒**就分配到机器
    #   ⇒ 改用 `macos-15`。注意它只装到 Xcode 26.3/26.4（**没有 26.5**），
    #     所以下面的 Xcode 选择步骤放宽为「有 26.5 就用 26.5，否则取最新 26.x」；
    #     本作业的指令集基线完全由 `-mcpu=apple-a10` + 显式部署目标 17.4 决定，
    #     与 Xcode 的小版本无关（构建清单里会如实记录实际用的版本）。
    runs-on: macos-15
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v6.0.2

      # ⚠️ 与 `ios.yml` / `ios-fast.yml` / `ios-release.yml` 里**同一个 key**：
      #    actions/cache 的缓存是仓库级的，本工作流构建一次之后，
      #    其它工作流就能直接复用产物、不必各自再编一遍。
      - name: Cache Unicorn xcframework
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: Vendor/AnisetteKit/Unicorn.xcframework
          key: unicorn-${{ runner.os }}-${{ hashFiles('Scripts/ensure-unicorn.sh') }}
          restore-keys: |
            unicorn-${{ runner.os }}-

      - name: Select Xcode (26.5 if available, otherwise newest 26.x)
        run: |
          # `macos-26` 有 Xcode 26.5；`macos-15` 只到 26.3/26.4。两者都能做本作业，
          # 因为指令集基线来自 `-mcpu=apple-a10` + `CMAKE_OSX_DEPLOYMENT_TARGET=17.4`。
          if [[ -d /Applications/Xcode_26.5.app ]]; then
            picked=/Applications/Xcode_26.5.app
          else
            picked="$(ls -d /Applications/Xcode_26*.app 2>/dev/null | sort -V | tail -n 1)"
          fi
          test -n "$picked"
          test -d "$picked"
          sudo xcode-select --switch "$picked/Contents/Developer"
          xcodebuild -version
          xcodebuild -version | head -n 1 | grep -Eq '^Xcode 26\.'
          echo "selected Xcode at $picked"
          echo "selected_xcode=$picked" >> "$GITHUB_STEP_SUMMARY"

      - name: Install CMake
        run: |
          if ! command -v cmake >/dev/null 2>&1; then
            brew install --quiet cmake
          fi
          cmake --version

      - name: Rebuild Unicorn without LSE
        env:
          UNICORN_TARGET_CPU: ${{ github.event.inputs.target_cpu || 'apple-a10' }}
        run: bash Scripts/ensure-unicorn.sh

      - name: Re-verify instruction-set baseline on the produced xcframework
        run: |
          python3 Scripts/verify-no-lse.py \
            --label "Unicorn.xcframework (rebuild workflow)" \
            --max-ios-version 17.4 \
            --max-examples 20 \
            Vendor/AnisetteKit/Unicorn.xcframework

      - name: Reproductibility manifest
        run: |
          {
            echo "commit=${GITHUB_SHA}"
            echo "ref=$(cat Vendor/AnisetteKit/Unicorn.xcframework/.source-fingerprint 2>/dev/null || echo missing)"
            echo "target_cpu=${{ github.event.inputs.target_cpu || 'apple-a10' }}"
            xcodebuild -version | tr '\n' ' '; echo
            cmake --version | head -n 1
          } > Unicorn-build-manifest.txt
          cat Unicorn-build-manifest.txt

      - name: Package xcframework
        run: |
          ditto -c -k --sequesterRsrc --keepParent \
            Vendor/AnisetteKit/Unicorn.xcframework \
            Unicorn.xcframework.zip
          shasum -a 256 Unicorn.xcframework.zip > Unicorn.xcframework.zip.sha256
          cat Unicorn.xcframework.zip.sha256

      - name: Upload rebuilt Unicorn
        uses: actions/upload-artifact@v7.0.1
        with:
          name: unicorn-armv8.0
          path: |
            Unicorn.xcframework.zip
            Unicorn.xcframework.zip.sha256
            Unicorn-build-manifest.txt
          retention-days: 30
